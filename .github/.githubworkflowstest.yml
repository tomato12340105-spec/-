name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: |
          pip install pytest pytest-cov

      - name: テスト実行（カバレッジ強制）
        run: |
          if [ -f test_auto.py ]; then
            pytest --cov=. --cov-report=term --cov-fail-under=80
          else
            python -m py_compile ollama_groq_pipeline.py
          fi