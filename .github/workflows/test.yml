name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-cov
      - run: |
          if [ -f test_auto.py ]; then
            pytest --cov=. --cov-report=term
          else
            python -m py_compile ollama_groq_pipeline.py
          fi